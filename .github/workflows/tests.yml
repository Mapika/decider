name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without torch (the tests cover the request layer and prompt rendering only)
        run: pip install pytest "transformers>=5" numpy
      - run: python -m pytest -q tests
        env:
          PYTHONPATH: .
