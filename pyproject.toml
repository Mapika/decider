[project]
name = "decider"
version = "0.9.0"
description = "One-pass typed decisions with calibrated probabilities (a System One style model on Qwen3.5-2B)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mark Marosi" }]
dependencies = ["torch", "transformers>=5", "flash-linear-attention", "numpy<2", "huggingface_hub"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "httpx"]
train = ["datasets", "accelerate", "scikit-learn", "pillow"]
games = ["gymnasium", "gym-super-mario-bros", "nes-py", "minigrid", "ale-py", "imageio"]
metal = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Repository = "https://github.com/Mapika/decider"
Weights = "https://huggingface.co/Mapika/decider-2b"

[tool.setuptools.packages.find]
include = ["decider*"]
